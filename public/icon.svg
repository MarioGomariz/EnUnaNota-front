<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181126"/>
      <stop offset="50%" stop-color="#0f0c19"/>
      <stop offset="100%" stop-color="#07050b"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e74"/>
      <stop offset="45%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
  </defs>

  <!-- Full Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <g >
    <!-- Ambient background glow behind microphone -->
    <circle cx="256" cy="230" r="140" fill="#d946ef" opacity="0.22" filter="url(#ambient)"/>
    <circle cx="340" cy="160" r="70" fill="#ff2e74" opacity="0.25" filter="url(#ambient)"/>

    <!-- Musical Note (Upper Right) -->
    <g filter="url(#glow)" opacity="0.95">
      <path d="M365 140 V82 C365 77 369 73 374 74 L415 82 C419 83 422 87 422 91 V130" 
            stroke="url(#primaryGrad)" stroke-width="7" stroke-linecap="round"/>
      <path d="M365 98 L422 108" stroke="url(#primaryGrad)" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="348" cy="142" rx="18" ry="14" transform="rotate(-20 348 142)" fill="url(#primaryGrad)"/>
      <ellipse cx="405" cy="132" rx="18" ry="14" transform="rotate(-20 405 132)" fill="url(#primaryGrad)"/>
    </g>

    <!-- Musical Note (Upper Left) -->
    <g filter="url(#glow)" opacity="0.85">
      <path d="M125 170 V125 C125 120 130 116 135 118 L160 125" 
            stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="112" cy="172" rx="15" ry="12" transform="rotate(-20 112 172)" fill="url(#accentGrad)"/>
    </g>

    <!-- Sparkles -->
    <g fill="#fff" opacity="0.9">
      <path d="M380 230 Q380 245 395 245 Q380 245 380 260 Q380 245 365 245 Q380 245 380 230" fill="url(#primaryGrad)"/>
      <circle cx="135" cy="250" r="4" fill="#38bdf8"/>
      <circle cx="390" cy="90" r="3" fill="#ffffff"/>
    </g>

    <!-- Main Microphone Body -->
    <g filter="url(#glow)">
      <!-- Mic Stand U-shaped Arc -->
      <path d="M182 220 V245 C182 286 215 319 256 319 C297 319 330 286 330 245 V220" 
            fill="none" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round"/>

      <!-- Mic Stem -->
      <path d="M256 324 V385" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round"/>

      <!-- Mic Stand Base -->
      <path d="M200 385 H312" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round"/>

      <!-- Mic Capsule Body -->
      <rect x="210" y="130" width="92" height="150" rx="46" fill="url(#primaryGrad)"/>

      <!-- Mic Capsule Inner Highlight & Grid -->
      <rect x="214" y="134" width="84" height="142" rx="42" fill="#0f0c19" fill-opacity="0.35"/>

      <!-- Horizontal Grid Lines -->
      <line x1="218" y1="165" x2="294" y2="165" stroke="url(#meshGrad)" stroke-width="4" stroke-linecap="round"/>
      <line x1="210" y1="205" x2="302" y2="205" stroke="#ffffff" stroke-opacity="0.6" stroke-width="6"/>
      <line x1="218" y1="245" x2="294" y2="245" stroke="url(#meshGrad)" stroke-width="4" stroke-linecap="round"/>

      <!-- Vertical Center Accent -->
      <line x1="256" y1="135" x2="256" y2="202" stroke="url(#meshGrad)" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Glossy Shine on Left -->
      <path d="M224 155 Q220 180 220 205" stroke="#ffffff" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Sound Wave Arcs around the Mic -->
    <g stroke="url(#primaryGrad)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.65">
      <path d="M350 200 A 70 70 0 0 1 350 260"/>
      <path d="M162 200 A 70 70 0 0 0 162 260"/>
    </g>
  </g>
</svg>