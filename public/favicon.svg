<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0c0b10"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="16" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#d946ef" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Musical Note Icon with Glow -->
  <g filter="url(#glow)">
    <!-- Beamed Eighth Notes (En Una Nota theme) -->
    <path d="M26 40V17C26 15.3431 27.3431 14 29 14H43C44.6569 14 46 15.3431 46 17V36" stroke="url(#noteGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 22H46" stroke="url(#noteGrad)" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Left Note Head -->
    <ellipse cx="20" cy="40" rx="6.5" ry="5" transform="rotate(-20 20 40)" fill="url(#noteGrad)"/>
    
    <!-- Right Note Head -->
    <ellipse cx="40" cy="36" rx="6.5" ry="5" transform="rotate(-20 40 36)" fill="url(#noteGrad)"/>

    <!-- Sparkle dot -->
    <circle cx="48" cy="12" r="2.5" fill="#fbcfe8"/>
  </g>
</svg>